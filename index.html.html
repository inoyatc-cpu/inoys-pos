<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inoya POS 三機/三部門實時同步系統</title>
    <!-- 載入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- 載入 html2canvas (用於將明細下載為圖片) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
        
        html, body {
            margin: 0; padding: 0; min-height: 100vh;
            width: 100%; max-width: 100vw; overflow-x: hidden;
            font-size: 19px;
        }

        /* 🔒 密碼鎖定畫面 */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 15, 15, 0.96); z-index: 9999;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .auth-card {
            background: white; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
        }
        .auth-card h2 { margin-top: 0; color: #222; font-size: 1.8rem; }
        .auth-card p { color: #555; font-size: 1.1rem; margin-bottom: 20px; }
        .auth-input {
            width: 100%; padding: 16px; font-size: 1.5rem; text-align: center; letter-spacing: 3px;
            border: 2px solid #ccc; border-radius: 8px; margin-bottom: 15px; outline: none;
        }
        .auth-input:focus { border-color: #ff9800; }
        .auth-btn {
            width: 100%; background: #ff9800; color: white; border: none; padding: 16px;
            font-size: 1.35rem; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .auth-btn:active { background: #e65100; }
        .error-msg { color: #d32f2f; font-size: 1.1rem; margin-top: 10px; display: none; font-weight: bold; }

        /* 頂部導航列 */
        .navbar { 
            position: sticky; top: 0; z-index: 1000;
            background: #111; color: white; display: flex; justify-content: space-around; align-items: center; 
            padding: 4px 6px; min-height: 48px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); width: 100%;
        }
        .nav-btn { 
            flex: 1;
            background: #333; color: #bbb; border: 1px solid #555; padding: 8px 0; 
            font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 0 2px;
            transition: all 0.2s ease; text-align: center;
        }
        .nav-btn.active { 
            background: #ff9800; color: #000; font-size: 1.05rem; border-color: #fff;
            box-shadow: 0 0 8px rgba(255,152,0,0.8);
        }
        .nav-btn.lock-btn { max-width: 45px; background: #d32f2f; color: white; border: none; }

        /* 切換頁面提示 (Toast) */
        #modeToast {
            position: fixed; top: 55px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; font-size: 1.1rem; font-weight: bold;
            border-radius: 30px; border: 2px solid #ff9800; z-index: 2000; display: none; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); width: 85%; max-width: 320px;
        }

        /* 各頁面專屬底色 */
        .page { display: none; padding-bottom: 50px; min-height: calc(100vh - 48px); width: 100%; overflow-x: hidden; }
        #pos.page { background-color: #fff8e7; } 
        #kitchen.page { background-color: #1a1a1a; } 
        #pass.page { background-color: #0d1b2a; } 
        #receipt.page { background-color: #e0f2f1; }
        #stats.page { background-color: #f3e5f5; }
