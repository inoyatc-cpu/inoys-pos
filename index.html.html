<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小店落單系統</title>
    <!-- 引入 Firebase Web SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding: 15px; }

        /* 導航 tab */
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; font-size: 18px; font-weight: bold; border: none; background: #e0e0e0; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: #007aff; color: white; }

        /* 視圖切換 */
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* --- 落單介面 --- */
        .pos-container { display: flex; gap: 15px; flex-wrap: wrap; }
        .menu-section { flex: 3; min-width: 300px; }
        .cart-section { flex: 2; min-width: 280px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .category-title { font-size: 18px; font-weight: bold; margin: 15px 0 8px 0; color: #007aff; border-bottom: 2px solid #007aff; padding-bottom: 4px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .menu-item { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; transition: 0.1s; }
        .menu-item:active { background: #eef5ff; transform: scale(0.98); }
        .item-name { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .item-price { color: #e65100; font-weight: bold; }

        /* 購物車 */
        .cart-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .cart-controls button { width: 28px; height: 28px; border: none; background: #007aff; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .cart-total { font-size: 22px; font-weight: bold; text-align: right; margin: 15px 0; color: #d32f2f; }
        .submit-btn { width: 100%; padding: 15px; font-size: 20px; font-weight: bold; background: #2e7d32; color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* --- 廚房 & 出餐介面 --- */
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .order-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border-top: 6px solid #007aff; }
        .order-card.completed { border-top-color: #4caf50; opacity: 0.7; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .order-items { list-style: none; margin-bottom: 15px; }
        .order-item-row { padding: 6px 8px; font-size: 16px; border-radius: 4px; margin-bottom: 4px; }
        
        /* 🥤 飲品專用高亮顏色 (藍色背景) */
        .order-item-row.is-drink {
            background-color: #e3f2fd;
            color: #0d47a1;
            font-weight: bold;
            border-left: 4px solid #1976d2;
        }

        .action-btn { width: 100%; padding: 10px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }
        .btn-finish { background: #2e7d32; }
        .btn-print { background: #555; }

        /* 列印樣式 (Print CSS) */
        #printArea { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; font-family: monospace; font-size: 14px; color: #000; }
            .print-title { font-size: 20px; font-weight: bold; text-align: center; }
            .print-hr { border-top: 1px dashed #000; margin: 5px 0; }
            .print-row { display: flex; justify-content: space-between; font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- 頁籤切換 -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('pos')">🛒 落單前台</button>
        <button class="tab-btn" onclick="switchView('kitchen')">👨‍🍳 廚房/出餐</button>
    </div>

    <!-- 1. 落單前台 -->
    <div id="posView" class="view-panel active">
        <div class="pos-container">
            <div class="menu-section" id="menuContainer"></div>
            <div class="cart-section">
                <div class="cart-title">現時訂單</div>
                <div id="cartList"></div>
                <div class="cart-total">總計: $<span id="cartTotal">0</span></div>
                <button class="submit-btn" onclick="submitOrder()">發送訂單到廚房</button>
            </div>
        </div>
    </div>

    <!-- 2. 廚房/出餐 -->
    <div id="kitchenView" class="view-panel">
        <div class="orders-grid" id="ordersContainer"></div>
    </div>

    <!-- 列印專用隱藏區塊 -->
    <div id="printArea"></div>

    <script>
        // --- 1. Firebase 初始化 (請替換為你的配置) ---
        const firebaseConfig = {
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com" // 請替換成你的 Firebase URL
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. 菜單資料 (已加入「丼飯 > 髀丼 $36」) ---
        const menuData = [
            {
                category: "丼飯",
                items: [
                    { id: "d1", name: "髀丼", price: 36, isDrink: false },
                    { id: "d2", name: "豬扒丼", price: 42, isDrink: false },
                    { id: "d3", name: "牛丼", price: 45, isDrink: false }
                ]
            },
            {
                category: "飲品",
                items: [
                    { id: "b1", name: "凍檸茶", price: 16, isDrink: true },
                    { id: "b2", name: "熱奶茶", price: 14, isDrink: true },
                    { id: "b3", name: "汽水", price: 10, isDrink: true }
                ]
            }
        ];

        let cart = [];

        // 渲染菜單
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            
            menuData.forEach(cat => {
                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.innerText = cat.category;
                container.appendChild(catTitle);

                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                cat.items.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'menu-item';
                    itemEl.onclick = () => addToCart(item);
                    itemEl.innerHTML = `
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">$${item.price}</div>
                    `;
                    grid.appendChild(itemEl);
                });
                container.appendChild(grid);
            });
        }

        // 購物車邏輯
        function addToCart(item) {
            const existing = cart.find(i => i.id === item.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const listEl = document.getElementById('cartList');
            const totalEl = document.getElementById('cartTotal');
            listEl.innerHTML = '';
            
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div>${item.name} ($${item.price})</div>
                    <div class="cart-controls">
                        <button onclick="changeQty('${item.id}', -1)">-</button>
                        <span style="margin: 0 8px;">${item.qty}</span>
                        <button onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                `;
                listEl.appendChild(row);
            });
            totalEl.innerText = total;
        }

        // 提交訂單到 Firebase
        function submitOrder() {
            if (cart.length === 0) return alert('購物車係空的！');

            const orderData = {
                seqNo: Math.floor(1000 + Math.random() * 9000), // 隨機單號
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                items: cart,
                total: cart.reduce((sum, i) => sum + (i.price * i.qty), 0),
                status: 'pending',
                timestamp: Date.now()
            };

            db.ref('orders').push(orderData).then(() => {
                cart = [];
                updateCartUI();
                alert('已發送到廚房！');
            });
        }

        // 監聽 Firebase 訂單更新廚房介面
        db.ref('orders').on('value', (snapshot) => {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';
            const data = snapshot.val();
            
            if (!data) return;

            // 轉成陣列並按時間倒序排序
            const orders = Object.entries(data).map(([key, value]) => ({ id: key, ...value }));
            orders.sort((a, b) => b.timestamp - a.timestamp);

            orders.forEach(order => {
                if (order.status === 'completed') return; // 隱藏已完成單

                const card = document.createElement('div');
                card.className = 'order-card';

                let itemsListHtml = '';
                order.items.forEach(item => {
                    // 🥤 判斷是否飲品，套用不同 CSS Style (亮藍色背景)
                    const drinkClass = item.isDrink ? 'is-drink' : '';
                    itemsListHtml += `
                        <li class="order-item-row ${drinkClass}">
                            ${item.name} x${item.qty}
                        </li>
                    `;
                });

                card.innerHTML = `
                    <div class="order-header">
                        <span>#${order.seqNo}</span>
                        <span>${order.time}</span>
                    </div>
                    <ul class="order-items">
                        ${itemsListHtml}
                    </ul>
                    <button class="action-btn btn-finish" onclick="completeOrder('${order.id}')">✅ 完成出餐</button>
                    <button class="action-btn btn-print" onclick='printOrder(${JSON.stringify(order)})'>🖨️ 印單</button>
                `;
                container.appendChild(card);
            });
        });

        // 完成出餐
        function completeOrder(orderId) {
            db.ref('orders/' + orderId).update({ status: 'completed' });
        }

        // 印單功能
        function printOrder(order) {
            const printDiv = document.getElementById('printArea');
            let itemsHtml = '';
            order.items.forEach(item => {
                itemsHtml += `
                    <div class="print-row">
                        <span>${item.name} x${item.qty}</span>
                        <span>$${item.price * item.qty}</span>
                    </div>`;
            });

            printDiv.innerHTML = `
                <div class="print-title">INOYA POS</div>
                <div style="text-align:center;">單號：#${order.seqNo}</div>
                <div style="text-align:center;">時間：${order.time}</div>
                <div class="print-hr"></div>
                ${itemsHtml}
                <div class="print-hr"></div>
                <div class="print-row" style="font-weight:bold;">
                    <span>總計：</span>
                    <span>$${order.total}</span>
                </div>
                <div class="print-hr"></div>
                <div style="text-align:center; font-size:12px;">~ 多謝光顧 ~</div>
            `;
            window.print();
        }

        // 頁籤切換邏輯
        function switchView(viewName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));

            if (viewName === 'pos') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('posView').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('kitchenView').classList.add('active');
            }
        }

        // 頁面載入初始化
        renderMenu();
    </script>
</body>
</html>
